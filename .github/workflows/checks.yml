name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s agents -p 'test_*.py'
      - run: python -m unittest discover -s data -p 'test_*.py'
      - run: npm run data:build
      - run: git diff --exit-code -- data/evidence.json prototype/evidence-data.mjs
